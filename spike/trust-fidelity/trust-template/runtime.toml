[bundle]
version = 1

[resource]
name = "MainRes"
cycle_interval_ms = 10

[runtime.control]
mode = "debug"
debug_enabled = true

[runtime.web]
enabled = false

[runtime.discovery]
enabled = false

[runtime.mesh]
enabled = false

[runtime.log]
level = "info"

[runtime.retain]
mode = "none"
save_interval_ms = 1000

[runtime.watchdog]
enabled = false
timeout_ms = 1000
action = "halt"

[runtime.fault]
policy = "halt"

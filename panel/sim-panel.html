<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CODESYS simulation</title>
<style>
:root {
  --bg: var(--color-background-primary, #ffffff);
  --bg2: var(--color-background-secondary, #f5f5f4);
  --fg: var(--color-text-primary, #1c1917);
  --fg2: var(--color-text-secondary, #57534e);
  --line: var(--color-border-primary, #e7e5e4);
  --accent: var(--color-text-info, #2563eb);
  --ok: #16a34a;
  --warn: #d97706;
  --bad: #dc2626;
  --water: #3b82f6;
  --water-bg: rgba(59, 130, 246, 0.12);
  --hl: rgba(250, 204, 21, 0.28);
  --font: var(--font-sans, system-ui, -apple-system, "Segoe UI", sans-serif);
  --mono: var(--font-mono, ui-monospace, "Cascadia Code", Consolas, monospace);
  --radius: var(--border-radius-md, 8px);
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: var(--color-background-primary, #1c1b1a);
    --bg2: var(--color-background-secondary, #262523);
    --fg: var(--color-text-primary, #f5f5f4);
    --fg2: var(--color-text-secondary, #a8a29e);
    --line: var(--color-border-primary, #3a3835);
    --hl: rgba(250, 204, 21, 0.18);
  }
}
:root[data-theme="dark"] {
  --bg: var(--color-background-primary, #1c1b1a);
  --bg2: var(--color-background-secondary, #262523);
  --fg: var(--color-text-primary, #f5f5f4);
  --fg2: var(--color-text-secondary, #a8a29e);
  --line: var(--color-border-primary, #3a3835);
  --hl: rgba(250, 204, 21, 0.18);
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--fg); font: 13px/1.4 var(--font); }
body { padding: 10px; }
header { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 999px; background: var(--bg2); font-weight: 600; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--fg2); }
.pill.running .dot { background: var(--ok); animation: pulse 1s infinite; }
.pill.paused .dot { background: var(--warn); }
.pill.stopped .dot { background: var(--fg2); }
@keyframes pulse { 50% { opacity: 0.35; } }
.meta { color: var(--fg2); font-variant-numeric: tabular-nums; }
.activity { color: var(--accent); flex: 1 1 200px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.badge { margin-left: auto; font-size: 11px; color: var(--fg2); border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; white-space: nowrap; }
.badge.warn { color: var(--warn); border-color: var(--warn); cursor: help; }
.grid { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 10px; }
@media (max-width: 680px) { .grid { grid-template-columns: minmax(0, 1fr); } }
.card { background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; display: flex; flex-direction: column; min-height: 0; }
.card h2 { margin: 0; padding: 6px 10px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: var(--fg2); background: var(--bg2); border-bottom: 1px solid var(--line); display: flex; gap: 8px; align-items: center; }
.card h2 .sub { text-transform: none; letter-spacing: 0; font-weight: 500; color: var(--fg); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.code { font: 12px/1.5 var(--mono); overflow: auto; height: 330px; padding: 4px 0; }
.ln { display: grid; grid-template-columns: 14px 34px minmax(0, 1fr); white-space: pre; }
.ln .bp { color: var(--bad); text-align: center; }
.ln .no { color: var(--fg2); text-align: right; padding-right: 10px; user-select: none; }
.ln .tx { padding-right: 10px; }
.ln.decl .tx { color: var(--fg2); }
.ln.gen .tx { color: var(--fg2); font-style: italic; }
.ln.cur { background: var(--hl); }
.ln.cur .no { color: var(--fg); font-weight: 700; }
.sect { font: 600 11px var(--font); color: var(--accent); padding: 6px 10px 2px 48px; }
.right { display: grid; gap: 10px; grid-template-rows: auto 1fr; min-height: 0; }
.pid svg { display: block; width: 100%; height: 200px; }
.pid text { font: 11px var(--font); fill: var(--fg); }
.pid .small { font-size: 10px; fill: var(--fg2); }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
td { padding: 3px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; vertical-align: top; }
td .r { font-size: 10px; }
td.v { text-align: right; font-family: var(--mono); }
td.r { color: var(--fg2); font-size: 11px; }
tr:last-child td { border-bottom: 0; }
.io { overflow: auto; max-height: 150px; }
.forced { color: var(--warn); font-weight: 700; font-size: 10px; margin-left: 4px; }
.trend { margin-top: 10px; }
.trend canvas { display: block; width: 100%; height: 60px; }
.bottom { margin-top: 10px; }
.list { overflow: auto; max-height: 150px; }
.list div { padding: 3px 10px; border-bottom: 1px solid var(--line); }
.list .t { color: var(--fg2); font-variant-numeric: tabular-nums; margin-right: 6px; }
.exp b { font-weight: 600; }
.exp .m { color: var(--fg2); }
.better { color: var(--ok); }
.worse { color: var(--bad); }
.empty { color: var(--fg2); padding: 10px; }
.banner { display: none; padding: 8px 10px; margin-bottom: 8px; border-radius: var(--radius); background: var(--bg2); color: var(--fg2); }
body.superseded .banner { display: block; }
body.superseded main { opacity: 0.45; pointer-events: none; }
</style>
</head>
<body>
<div class="banner">A newer simulation panel is open; this one stopped updating.</div>
<header>
  <span id="status" class="pill stopped"><span class="dot"></span><span id="statusText">Connecting</span></span>
  <span id="meta" class="meta"></span>
  <span id="activity" class="activity"></span>
  <span id="badge" class="badge">Simulated in truST</span>
</header>
<main>
  <div class="grid">
    <section class="card"><h2>Code <span id="codeTitle" class="sub"></span></h2><div id="code" class="code"><div class="empty">No code yet.</div></div></section>
    <div class="right">
      <section class="card pid"><h2>Plant</h2><div id="pid"></div></section>
      <section class="card"><h2>I/O</h2><div id="io" class="io"></div></section>
    </div>
  </div>
  <section class="card trend"><h2>Trend <span id="trendInfo" class="sub"></span></h2><canvas id="trend" height="150"></canvas></section>
  <div class="grid bottom">
    <section class="card"><h2>Experiments</h2><div id="exps" class="list"><div class="empty">No experiments yet.</div></div></section>
    <section class="card"><h2>Events</h2><div id="events" class="list"><div class="empty">No events yet.</div></div></section>
  </div>
</main>
<script>/*PANEL_SCRIPT*/</script>
</body>
</html>
